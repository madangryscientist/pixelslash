<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>random</title>
  <style>
    body { margin: 24px; font: 16px/1.5 sans-serif; background: #fff; color: #111; }
    #box { position: absolute; top: 120px; width: 60px; height: 60px; background: #e11d48; }
  </style>
</head>
<body>
  <h1>A box that lands somewhere new on every load</h1>
  <div id="box"></div>
  <script>
    // Not the page clock: a pinned clock does not pin this, so no two loads agree.
    // A driver that wants a guaranteed new position per load (the flake test's site server)
    // names the left on <html data-left>; a draw on its own can land on the same x twice, so
    // it is only the fallback for a server that hands out no position.
    const handed = document.documentElement.dataset.left;
    const [drawn] = crypto.getRandomValues(new Uint32Array(1));
    const left = handed === undefined ? 24 + (drawn % 600) : Number(handed);
    document.getElementById("box").style.left = `${left}px`;
  </script>
</body>
</html>
