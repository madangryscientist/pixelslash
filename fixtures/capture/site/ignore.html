<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ignore</title>
  <style>
    body { margin: 0; font: 16px/1.5 sans-serif; background: #fff; color: #111; }
    .video { position: absolute; left: 40px; top: 40px; width: 200px; height: 100px; background: #16a34a; }
    .marked { position: absolute; left: 300px; top: 40px; width: 100px; height: 60px; background: #f59e0b; }
    .still { position: absolute; left: 0; top: 300px; width: 320px; height: 40px; background: #2563eb; }
  </style>
</head>
<body>
  <div class="video"></div>
  <div class="marked" data-pixelslash-ignore></div>
  <div class="still"></div>
</body>
</html>
