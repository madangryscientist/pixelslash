# Inherited by the projects tagged `dotnet`: the C# port of the diff, which is two .NET projects
# built and tested as the one moon project `dotnet`.
$schema: "../cache/schemas/tasks.json"

inheritedBy:
  tags: ["dotnet"]

implicitInputs:
  # dotnet's own output. Left in, a build would change the hash it is hashed under.
  - "!/**/bin/**"
  - "!/**/obj/**"
  - "!/**/TestResults/**"
  - "!/engines/dotnet/native/out/**"
