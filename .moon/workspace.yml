# moon workspace. A project id is its directory's old Nx name, so `bunx moon run engine:test` runs the
# engine's tests. The two .NET projects (the .csproj files under engines/dotnet) are one moon project,
# `dotnet`. Projects are listed, not globbed.
#
# No toolchain is declared (no .moon/toolchains.yml): every task runs on the `system` toolchain, so
# moon runs our bun commands as they are and never downloads Bun or runs `bun install`.
# The cache lives in .moon/cache (gitignored); moon has no setting to move it.
$schema: "./cache/schemas/workspace.json"

projects:
  site: "apps/site"
  web: "apps/web"
  bench: "bench"
  cli: "packages/cli"
  engine: "packages/engine"
  playwright: "packages/playwright"
  scripts: "scripts"
  dotnet: "engines/dotnet"

vcs:
  client: "git"
  defaultBranch: "main"

pipeline:
  installDependencies: false

# The shared remote cache, over HTTP. Its public door answers only a request that carries a bearer
# token, reads included. `auth.token` names the env var that holds it (unset or empty sends none). In
# CI a pull request reads with the read token and only a push to main holds the write token, so a branch
# cannot poison the cache (.github/workflows/ci.yml). Outside CI moon only downloads (`localReadOnly`); a
# local run with no token gets a 401 and runs on its local cache alone.
remote:
  api: "http"
  host: "https://moon-cache.madangryscientist.com"
  auth:
    token: "MOON_REMOTE_TOKEN"
  cache:
    localReadOnly: true

telemetry: false
