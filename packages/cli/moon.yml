$schema: "../../.moon/cache/schemas/project.json"

tags: ["ts"]

dependsOn:
  - "engine"

tasks:
  typecheck:
    command: "tsc -p packages/cli/tsconfig.json"
    options:
      runFromWorkspaceRoot: true
  lint:
    script: "oxlint --type-aware --deny-warnings packages/cli && bun scripts/check-slop.ts packages/cli"
    options:
      runFromWorkspaceRoot: true
  test:
    command: "bun --bun vitest run"
    inputs:
      - "**/*"
      - "/fixtures/**/*"
      - "$PIXELSLASH_TEST_BROWSERS"
  build:
    command: "bun scripts/build-cli.ts"
    options:
      cache: false
      runFromWorkspaceRoot: true
  smoke:
    command: "bun --bun vitest run -c vitest.smoke.config.ts"
    deps:
      - "~:build"
    options:
      cache: false
