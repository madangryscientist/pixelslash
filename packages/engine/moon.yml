$schema: "../../.moon/cache/schemas/project.json"

tags: ["ts"]

tasks:
  typecheck:
    command: "tsc -p packages/engine/tsconfig.json"
    options:
      runFromWorkspaceRoot: true
  lint:
    script: "oxlint --type-aware --deny-warnings packages/engine && bun scripts/check-slop.ts packages/engine"
    options:
      runFromWorkspaceRoot: true
  test:
    command: "bun --bun vitest run"
    inputs:
      - "**/*"
      - "/fixtures/**/*"
      - "/engines/wasm/**/*"
      - "!/engines/wasm/target/**/*"
      - "/bench/corpus/**/*"
      - "/bench/src/perf/fixtures.ts"
      - "$PIXELSLASH_TEST_BROWSERS"
