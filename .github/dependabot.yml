version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: nuget
    directories:
      - /engines/dotnet/PixelSlash.Diff
      - /engines/dotnet/PixelSlash.Diff.Tests
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
