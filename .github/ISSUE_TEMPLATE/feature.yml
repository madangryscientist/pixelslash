name: Feature request
description: Something PixelSlash should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The behaviour you expect, for example a flag, a report change or an API field. `docs/cli.md` is the contract, and changes to `/api/v1` are additive only.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you tried
      description: Other tools, or a workaround you use now.
