name: CI

# The gate from AGENTS.md, on a GitHub-hosted runner. No secrets are read, and the trigger is
# `pull_request` (never `pull_request_target`), so a pull request from a fork runs with a read-only
# token. Actions are pinned to a commit; the tag is in the comment.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # release.yml runs this same gate before it publishes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Bun the repo is built and pinned against (docker/capture/Dockerfile, bench/PERF.md).
  BUN_VERSION: "1.4.2"

jobs:
  gate:
    name: Gate (typecheck, lint, format, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Nx never talks to Nx Cloud from CI: NX_NO_CLOUD is on, so no run starts a pipeline execution
    # (those are billed in credits). Nx's own local cache is kept between runs with actions/cache
    # instead, which is free. Nx 24 indexes the cache in a database, so the cache directory alone is
    # rejected on a fresh runner (0 hits); `.nx/cache` and `.nx/workspace-data` are saved together, and
    # NX_CACHE_DIRECTORY keeps the cache in the checkout (Nx 24 defaults to ~/.nx). Nx still checks
    # every entry by its hash. GitHub scopes a cache to the ref that saved it: a pull
    # request reads and writes only its own, plus the base branch's, and `main` cannot read a PR's, so
    # a branch can never poison main's cache. The key carries the ref and the sha, so every run saves a
    # fresh entry; restore-keys fall back to the last entry of the same ref, then to main's.
    # A tag (a release, which calls this workflow) never restores or saves the cache, so a release
    # gate always runs uncached.
    env:
      NX_NO_CLOUD: "true"
      NX_CACHE_DIRECTORY: .nx/cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # global.json pins the SDK; engines/dotnet is part of the gate where an SDK exists.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: bun install --frozen-lockfile
      - name: Restore the Nx cache
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .nx/cache
            .nx/workspace-data
          key: nx-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ github.ref }}-
            nx-${{ runner.os }}-refs/heads/main-
      # Run from packages/engine: the isolated linker gives the root no `playwright` bin.
      - name: Install the Playwright browser
        working-directory: packages/engine
        run: bunx playwright install --with-deps chromium-headless-shell
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      # Includes bench:check (the regression guard); never bench:perf.
      - run: bun run test

  # The Playwright helper on plain Node, outside the workspace (PS-237): both packages are packed,
  # installed from their tarballs into a copy of examples/playwright-node, its tests run with no `bun`
  # on PATH, and `pixelslash upload` takes the dir they wrote. Nothing is published.
  example:
    name: Playwright example on Node (packed tarballs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      # System libraries for chromium; the check installs the browser itself, from the sample's Playwright.
      - name: Install the browser's system libraries
        working-directory: packages/engine
        run: bunx playwright install-deps chromium-headless-shell
      - run: bun run check:example

  changes:
    name: Did the web app change?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # apps/web and packages (what it imports), plus what decides how they install and run.
          if git diff --name-only "origin/$BASE_REF...HEAD" \
            | grep -qE '^(apps/web/|packages/|fixtures/|bun\.lock$|bunfig\.toml$|\.github/workflows/ci\.yml$)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  web:
    name: Web gate (build, e2e, deploy dry run)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No Nx Cloud, as in `gate`; this job builds and runs e2e, so it keeps no Nx cache.
    env:
      NX_NO_CLOUD: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The e2e uploads run the CLI in this checkout, which wants a merge-base with main.
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: bun install --frozen-lockfile
      - name: Install the Playwright browser
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium-headless-shell
      - run: bunx nx build web
      - run: bunx nx test:e2e web
      - name: e2e against vite dev
        working-directory: apps/web
        run: bun run test:e2e:dev
      - name: Deploy dry run
        working-directory: apps/web
        run: bunx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/ps-web-dry"
      - name: Deploy dry run, env.production (app.pixelslash.dev)
        working-directory: apps/web
        run: |
          CLOUDFLARE_ENV=production bun run build
          bunx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/ps-web-dry-production"
