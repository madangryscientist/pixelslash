name: Flake repro (temporary)
on:
  push:
    branches: [review-spec-flake-a-decision-takes-three]
  workflow_dispatch:
env:
  BUN_VERSION: "1.4.2"
jobs:
  repro:
    name: ${{ matrix.variant }} / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [base, fixed]
        mode: [production, dev]
    env:
      NX_NO_CLOUD: "true"
      NX_DOTNET_DISABLE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Base variant (main before the change)
        if: matrix.variant == 'base'
        run: |
          git checkout 81f3215 -- apps/web/src
          git status --short
      - run: bun install --frozen-lockfile
      - name: Install the Playwright browser
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium-headless-shell
      - name: 20 repeats
        id: run
        continue-on-error: true
        working-directory: apps/web
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/report.json
        run: |
          # Host load like the failing runs (20 to 90): CPU burners, twice the core count.
          for _ in $(seq $(( $(nproc) * 2 ))); do (yes > /dev/null &) ; done
          if [ "${{ matrix.mode }}" = dev ]; then
            bun run test:e2e:dev -- e2e/review.spec.ts --repeat-each 20 --reporter=list,json
          else
            bunx nx build web
            bunx playwright test e2e/review.spec.ts --repeat-each 20 --reporter=list,json
          fi
      - name: Count
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json,os
          r=json.load(open(os.environ["RUNNER_TEMP"]+"/report.json"))
          tot=ok=fail=pend=0; other={}
          def walk(s):
              for sp in s.get("specs",[]):
                  for t in sp["tests"]:
                      for res in t["results"]:
                          yield res
              for c in s.get("suites",[]): yield from walk(c)
          for s in r["suites"]:
              for res in walk(s):
                  tot+=1
                  if res["status"]=="passed": ok+=1
                  else:
                      fail+=1
                      msg=" ".join(e.get("message","")+e.get("snippet","") for e in res.get("errors",[]))
                      if False: pass
                      else:
                          k=msg.replace("\n"," ")[:140]; other[k]=other.get(k,0)+1
          print("RESULT ${{ matrix.variant }} / ${{ matrix.mode }}: runs=%d passed=%d failed=%d loadavg_at_end=%s"%(tot,ok,fail,open('/proc/loadavg').read().strip()))
          for k,v in other.items(): print("  other x%d: %s"%(v,k))
          PY
      - name: Keep the traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traces-${{ matrix.variant }}-${{ matrix.mode }}
          path: apps/web/test-results
          if-no-files-found: ignore
