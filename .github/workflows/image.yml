name: Capture image

# Builds docker/capture/Dockerfile and pushes it to GHCR as
# ghcr.io/madangryscientist/pixelslash-capture:<version> when a `v*` tag is pushed (v0.1.0 -> 0.1.0).
# Nothing else triggers it, so no pull request, fork or branch push can publish an image. The only
# credential is the run's own GITHUB_TOKEN; no other secret is read.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/madangryscientist/pixelslash-capture

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # linux/amd64 only: the pinned opencode tarball in the Dockerfile is x86-64.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/capture/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          build-args: |
            PIXELSLASH_IMAGE_VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: echo "$IMAGE:$VERSION@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
