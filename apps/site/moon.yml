$schema: "../../.moon/cache/schemas/project.json"

tags: ["ts"]

# Their tools (tsr, vite, playwright) live in the app's own node_modules/.bin, which moon does not
# put on PATH, so `bun run` finds them from the app's directory.
tasks:
  typecheck:
    script: "bun run tsr generate && tsc --noEmit"
  lint:
    script: "oxlint --type-aware --deny-warnings apps/site && bun scripts/check-slop.ts apps/site"
    options:
      runFromWorkspaceRoot: true
  test:
    command: "bun --bun vitest run"
    inputs:
      - "**/*"
      - "/README.md"
      - "/SECURITY.md"
      - "/apps/web/SELF-HOST.md"
      - "/docs/cli.md"
      - "/docs/getting-started.md"
      - "/docs/tutorials/**/*"
      - "/docs/ci/**/*"
      - "/docs/capabilities/data.json"
      - "/apps/web/github-app/manifest.json"
      - "/docs/metrics.md"
      - "/docs/concepts/**/*"
      - "/docs/help/**/*"
      - "/apps/web/src/**/*"
  build:
    command: "bun run vite build"
    inputs:
      - "**/*"
      - "/README.md"
      - "/SECURITY.md"
      - "/apps/web/SELF-HOST.md"
      - "/docs/cli.md"
      - "/docs/getting-started.md"
      - "/docs/tutorials/**/*"
      - "/docs/ci/**/*"
      - "/docs/capabilities/data.json"
      - "/apps/web/github-app/manifest.json"
      - "/docs/metrics.md"
      - "/docs/concepts/**/*"
      - "/docs/help/**/*"
    outputs:
      - "dist"
  test-e2e:
    command: "bun run playwright test"
    deps:
      - "~:build"
    options:
      cache: false
