$schema: "../../.moon/cache/schemas/project.json"

tags: ["ts"]

dependsOn:
  - "engine"

# Their tools (tsr, vite, playwright, vitest) live in the app's own node_modules/.bin, which moon does
# not put on PATH, so `bun run` finds them from the app's directory.
tasks:
  typecheck:
    script: "bun run tsr generate && tsc --noEmit"
  lint:
    script: "oxlint --type-aware --deny-warnings apps/web && bun scripts/check-slop.ts apps/web"
    options:
      runFromWorkspaceRoot: true
  test:
    command: "bun --bun vitest run"
    inputs:
      - "**/*"
      - "/fixtures/**/*"
      - "/docs/cli.md"
  # build, smoke and test-e2e all write `dist` and `.wrangler/deploy`. The smoke and the e2e cannot depend
  # on `build`, because each bakes its own run's stub ports and sidecar URL into the build
  # (vite.config.ts, pointAtStub). So the three share the `web-dist` mutex, and moon runs one at a time.
  build:
    command: "bun run vite build"
    # .wrangler/deploy/config.json is written by @cloudflare/vite-plugin and read by `vite preview`
    # and `wrangler`, so a cache hit must restore it with dist.
    outputs:
      - "dist"
      - ".wrangler/deploy"
    options:
      mutex: "web-dist"
  # The smoke and the e2e build the app themselves (the e2e's web server runs `bun run build`, the smoke's
  # harness too) and serve it on loopback only: a local D1, the GitHub and Sentry stand-ins and the diff
  # sidecar, nothing off the machine. So a run's result is the repo's files (the inherited inputs; a
  # failure's test-results and .wrangler are excluded there), the Playwright build pinned in bun.lock
  # (all.yml), and the env vars below. A failed run is never cached.
  smoke:
    command: "bun run vitest run -c vitest.smoke.config.ts"
    inputs:
      # Vitest refuses a `.only` when CI is set.
      - "$CI"
      # The token the smoke seeds and sends; its prefix picks which check authorizes it. It only opens the
      # run's own throwaway local D1, so hashing it exposes nothing.
      - "$PIXELSLASH_SMOKE_TOKEN"
    options:
      mutex: "web-dist"
  test-e2e:
    command: "bun run playwright test"
    options:
      mutex: "web-dist"
    inputs:
      # `forbidOnly` in playwright.config.ts.
      - "$CI"
      # Which server and diff path the run uses (playwright.config.ts).
      - "$PIXELSLASH_E2E_DEV"
      - "$PIXELSLASH_E2E_NO_SIDECAR"
      # rss-burst.spec.ts runs only when the count is set. It is a measurement (clock and RSS), run with
      # `bunx playwright test rss-burst` from apps/web, not through moon; these only keep a burst run through
      # moon from replaying the gate's pass. Add `--force` to measure through moon.
      - "$PIXELSLASH_RSS_BURST"
      - "$PIXELSLASH_RSS_HEIGHT"
      - "$PIXELSLASH_RSS_MODEL"
      # Where the specs write their screens: a new dir must get them.
      - "$PS_SHOT_DIR"
