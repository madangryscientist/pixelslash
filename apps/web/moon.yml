$schema: "../../.moon/cache/schemas/project.json"

tags: ["ts"]

dependsOn:
  - "engine"

# Their tools (tsr, vite, playwright, vitest) live in the app's own node_modules/.bin, which moon does
# not put on PATH, so `bun run` finds them from the app's directory.
tasks:
  typecheck:
    script: "bun run tsr generate && tsc --noEmit"
  lint:
    script: "oxlint --type-aware --deny-warnings apps/web && bun scripts/check-slop.ts apps/web"
    options:
      runFromWorkspaceRoot: true
  test:
    command: "bun --bun vitest run"
    inputs:
      - "**/*"
      - "/fixtures/**/*"
      - "/docs/cli.md"
  build:
    command: "bun run vite build"
    outputs:
      - "dist"
  smoke:
    command: "bun run vitest run -c vitest.smoke.config.ts"
    options:
      cache: false
  test-e2e:
    command: "bun run playwright test"
    options:
      cache: false
