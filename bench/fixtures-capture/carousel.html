<!doctype html>
<meta charset="utf-8" />
<title>Carousel</title>
<style>
  body {
    font: 16px/1.5 sans-serif;
    margin: 32px;
    color: #1d2433;
  }
  .viewport {
    width: 480px;
    height: 200px;
    overflow: hidden;
    border-radius: 12px;
  }
  .track {
    display: flex;
    width: 1440px;
    transition: transform 0.1s ease;
  }
  .slide {
    width: 480px;
    height: 200px;
    display: grid;
    place-items: center;
    font: 700 32px sans-serif;
    color: #fff;
  }
  .slide:nth-child(1) {
    background: #3563e9;
  }
  .slide:nth-child(2) {
    background: #1f9d6b;
  }
  .slide:nth-child(3) {
    background: #d6247b;
  }
  .dots {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #c3cadb;
  }
  .dot.on {
    background: #3563e9;
  }
</style>
<h1>Highlights</h1>
<div class="viewport">
  <div class="track" id="track">
    <div class="slide">One</div>
    <div class="slide">Two</div>
    <div class="slide">Three</div>
  </div>
</div>
<div class="dots" id="dots">
  <span class="dot on"></span><span class="dot"></span><span class="dot"></span>
</div>
<script>
  // Auto-advances on a timer, first tick after a random wait (the phase of load timing between runs).
  let i = 0;
  setTimeout(() => setInterval(tick, 200), Math.random() * 200);
  function tick() {
    i = (i + 1) % 3;
    document.getElementById("track").style.transform = "translateX(" + -480 * i + "px)";
    document.querySelectorAll(".dot").forEach((d, n) => d.classList.toggle("on", n === i));
  }
</script>
